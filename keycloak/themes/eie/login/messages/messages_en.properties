# Additions to the parent (keycloak) login messages.

# Used by info.ftl on the "Email verified" page. Approval is silent, so this
# tells the user to come back rather than to wait for an email.
eieAccountUnderReview=Thanks for confirming your email address. An Earth Information Explorer administrator will review your request, usually within two business days. Please try signing in again after that.

# Shown on the login page when an email-confirmation or password-reset link
# has expired. Re-registering fails with "email already registered", so this
# points people at signing in instead, which resends a fresh confirmation link.
actionExpiredMessage=Your link expired. If you were confirming your email, sign in again to get a new confirmation link. If you were resetting your password, request a new reset link.
actionExpiredDoLoginMessage=Your link expired. If you were confirming your email, sign in again to get a new confirmation link. If you were resetting your password, request a new reset link.
