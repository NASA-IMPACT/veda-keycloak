# Overrides for the verification email. Sent at registration, before admin
# review, so it must not imply the account is usable yet.
# Params: {0} link, {3} formatted expiry. Double any apostrophe — MessageFormat
# treats a single one as an escape.
emailVerificationSubject=Confirm your email for Earth Information Explorer
emailVerificationBody=Thanks for requesting access to Earth Information Explorer. Confirm this email address to continue:\n\n{0}\n\nAfter that, an Earth Information Explorer administrator reviews your request, usually within two business days. We will email you as soon as your account is approved.\n\nThis link expires in {3}.\n\nIf you did not request an EIE account, you can ignore this message.\n\n— The Earth Information Explorer team

# Approval email, sent by the email-on-approval listener when an administrator
# grants the eie-approved role. Params: {0} sign-in link.
approvalNotificationSubject=Your Earth Information Explorer access was approved
approvalNotificationBody=An administrator has approved your request for access to Earth Information Explorer. You can now sign in with the email address you registered with:\n\n{0}\n\nYou are receiving this message because you requested an EIE account.\n\n— The Earth Information Explorer team
approvalNotificationBodyNoLink=An administrator has approved your request for access to Earth Information Explorer. You can now sign in with the email address you registered with.\n\nYou are receiving this message because you requested an EIE account.\n\n— The Earth Information Explorer team
