# Overrides for the verification email. Sent at registration, before admin
# review, so it must not imply the account is usable yet.
# Params: {0} link, {3} formatted expiry. Double any apostrophe — MessageFormat
# treats a single one as an escape.
emailVerificationSubject=Confirm your email for Earth Information Explorer
emailVerificationBody=Thanks for requesting access to Earth Information Explorer. Confirm this email address to continue:\n\n{0}\n\nAfter you confirm, an administrator reviews your request — usually within two business days. Once that is done you will be able to sign in, so please try again after then.\n\nThis link expires in {3}.\n\nIf you did not request an EIE account, you can ignore this message.\n\n— The Earth Information Explorer team
