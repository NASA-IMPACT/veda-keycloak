version: 2
updates:
  - package-ecosystem: uv
    directory: /
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns:
        - "*"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: maven
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      maven:
        patterns:
        - "*"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
        - "*"
    commit-message:
      prefix: "ci(deps):"

  - package-ecosystem: pre-commit
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns:
        - "*"
    commit-message:
      prefix: "chore(deps):"
